services:
  conductor-cercano:
    build: .
    image: conductor-cercano:1.0.0
    container_name: conductor-cercano
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CC_ENTORNO: docker
      CC_ORIGENES_CORS: http://localhost:8000,http://localhost:5173
    volumes:
      - datos:/app/datos            # grafos, caché y SQLite persisten entre reinicios
      - ./benchmark/resultados:/app/benchmark/resultados:ro
    restart: unless-stopped

volumes:
  datos:
